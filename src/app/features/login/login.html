<div class="page">
  <!-- Center Card -->
  <div class="container">
    <h1>Welcome back</h1>
    <p class="subtitle">Enter your credentials to access your account</p>

    <div class="card">
      <form #loginForm="ngForm" (ngSubmit)="onSubmit(loginForm)">
        <!-- Email -->
        <label>Email</label>
        <div class="input-box">
          <input
            type="email"
            name="email"
            placeholder="you@example.com"
            [(ngModel)]="user.email"
            required
          />
        </div>

        <!-- Password -->
        <div class="password-row">
          <label>Password</label>
          <a class="link">Forgot password?</a>
        </div>

        <div class="input-box">
          <input
            type="password"
            name="password"
            placeholder="Enter your password"
            [(ngModel)]="user.password"
            required
          />
        </div>

        <!-- Submit -->
        <button type="submit" class="primary-btn">
          {{ isNewUser ? 'Sign up →' : 'Sign in →' }}
        </button>
      </form>

      <!-- Divider -->
      <div class="divider">
        <span>New to TodoApp</span>
      </div>

      <!-- Toggle -->
      <button
        type="button"
        class="secondary-btn"
        (click)="isNewUser = !isNewUser"
      >
        {{ isNewUser ? 'Back to login' : 'Create an account' }}
      </button>
    </div>
  </div>

  <!-- Footer -->
  <p class="footer">
    By signing in, you agree to our
    <a>Terms of Service</a> and
    <a>Privacy Policy</a>
  </p>
</div>
